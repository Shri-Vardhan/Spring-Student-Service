<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Insert Student</title>
</head>
<body>

<h2 th:text="${message}">Default Text</h2>

<form th:action="@{/web/insertStudent}" method="post">
    <label>Id:</label>
    <input type="number" name="id"/><br/>

    <label>Name:</label>
    <input type="text" name="name"/><br/>

    <label>Age:</label>
    <input type="number" name="age"/><br/>

    <button type="submit">Submit student</button>
</form>

</body>
</html>
