<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Update Student</title>
</head>
<body>

<h2>Update Student</h2>

<div th:if="${student}">
    <p><strong>ID:</strong> <span th:text="${student.id}"></span></p>
    <p><strong>Name:</strong> <span th:text="${student.name}"></span></p>
    <p><strong>Age:</strong> <span th:text="${student.age}"></span></p>

    <hr/>

    <form th:action="@{/web/updateStudent/{id}(id=${student.id})}" method="post">

        <label for="name">Name:</label><br/>
        <input type="text" id="name" name="name" th:value="${student.name}" required /><br/><br/>

        <label for="age">Age:</label><br/>
        <input type="number" id="age" name="age" th:value="${student.age}" required /><br/><br/>

        <button type="submit">Update</button>
    </form>

    <div th:if="${message}" th:text="${message}"></div>
</div>

</body>
</html>
